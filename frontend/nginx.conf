server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # —— Vue Router history 模式：所有非文件请求回退到 index.html ——
    location / {
        try_files $uri $uri/ /index.html;
    }

    # —— Phase 1 暂无后端，注释掉反代 ——
